<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#0A0A0C"/>
  
  <g transform="translate(256, 256)" fill="#FFFFFF">
    <!-- Plume / Crest -->
    <path d="M-30,-200 C-30,-200 0,-220 30,-200 L40,-130 L-40,-130 Z" />
    <path d="M-60,-130 L60,-130 L50,-100 L-50,-100 Z" opacity="0.8" />

    <!-- Main Helmet Shell -->
    <path d="M-120,-80 C-120,-160 120,-160 120,-80 L120,40 C120,120 60,180 0,180 C-60,180 -120,120 -120,40 Z" />

    <!-- Eye Slits & Nose Guard (Negative Space - Cutout as Dark) -->
    <path d="M-90,-10 L-20,-10 L-20,60 L-70,40 Z" fill="#0A0A0C"/>
    <path d="M90,-10 L20,-10 L20,60 L70,40 Z" fill="#0A0A0C"/>
    <!-- Central T-Zone Nose Bridge -->
    <rect x="-12" y="-20" width="24" height="110" fill="#0A0A0C"/>
  </g>
</svg>
